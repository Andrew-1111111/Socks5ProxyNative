name: Release Windows x64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        run: msbuild Socks5Proxy.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin\x64\Release\Socks5Proxy.exe dist\
          Copy-Item proxy.json dist\

      - name: Move x64 tag to current commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa x64 -m "Windows x64"
          git push origin x64 --force

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @(
            'A high-performance SOCKS5 proxy in C++20 (Windows, IOCP) with outbound traffic binding to a chosen interface, built-in DNS resolution, and detailed logging.'
            ''
            '## Features'
            ''
            '- Full baseline SOCKS5 (RFC 1928) support for CONNECT and UDP ASSOCIATE'
            '- IPv4, IPv6, and domain names'
            '- Asynchronous IOCP architecture for many concurrent connections'
            '- Bind outbound TCP/UDP to a specific local IP or interface name'
            '- Built-in DNS with caching, EDNS, retries, and TCP fallback'
            '- Authentication: No Auth, Username/Password, and GSSAPI (Windows SSPI)'
            '- UDP relay with client validation, source filtering, and idle timeout'
            '- Friendly IP names in logs and configurable console logging'
            ''
            '## Requirements'
            ''
            '- Windows 10/11 (x64)'
            '- Administrator privileges'
            ''
            '## Assets'
            ''
            '- Socks5Proxy.exe — application'
            '- proxy.json — example configuration (edit before use)'
            ''
            "Automated build: ${{ github.sha }}"
          ) | Set-Content -Path dist/RELEASE_NOTES.md -Encoding utf8

          gh release view x64 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create x64 `
              --title "Windows x64" `
              --notes-file dist/RELEASE_NOTES.md `
              dist/Socks5Proxy.exe `
              dist/proxy.json
          } else {
            gh release edit x64 --notes-file dist/RELEASE_NOTES.md
            gh release upload x64 `
              --clobber `
              dist/Socks5Proxy.exe `
              dist/proxy.json
          }
